; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PN532@^1.2.4
    # mbedtls is usually included with the ESP32 core, but add if needed
    # mbedtls

# Optional: Specify upload and monitor ports
# upload_port = /dev/cu.usbserial-...
# monitor_port = /dev/cu.usbserial-...

# Build flags if needed (e.g., for specific mbedtls config)
# build_flags =
#   -D MBEDTLS_CONFIG_FILE=\\\"mbedtls/esp_config.h\\\"

[env:esp32-c3-supermini]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
lib_deps = 
    # adafruit/Adafruit PN532@^1.2.4 # Removed, using custom version
    miguelbalboa/MFRC522@^1.4.10 # Keep for now, might be needed by Utils?
    # operatorfoundation/Crypto@^0.4.0 # Removed, using custom crypto
monitor_speed = 115200
upload_speed = 460800
build_flags = 
    -D USE_HARDWARE_SPI=1 # Define macro to include InitHardwareSPI
    # -D PN532DEBUG # Removed, custom library might handle debug differently
check_tool = cppcheck
check_flags =
    cppcheck: --enable=all --inline-suppr --suppress=missingIncludeSystem
monitor_echo = yes

[env:hardware_test]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
lib_deps = 
    adafruit/Adafruit PN532@^1.2.2
    miguelbalboa/MFRC522@^1.4.10
test_build_src = yes
test_filter = test_hardware_communication
build_src_filter = +<*> -<main.cpp>
src_filter = +<*> -<main.cpp> +<../test/test_hardware_communication/test_setup.cpp>
monitor_speed = 115200
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/include
check_tool = cppcheck
check_flags =
    cppcheck: --enable=all --inline-suppr --suppress=missingIncludeSystem

